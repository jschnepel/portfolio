<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <rect width="800" height="450" fill="#0D0F12"/>
  <!-- Subtle background grid -->
  <g stroke="#1A1D22" stroke-width="0.5">
    <line x1="0" y1="75" x2="800" y2="75"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="133" y1="0" x2="133" y2="450"/>
    <line x1="266" y1="0" x2="266" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="533" y1="0" x2="533" y2="450"/>
    <line x1="666" y1="0" x2="666" y2="450"/>
  </g>
  <!-- Enclosure / restricted boundary -->
  <rect x="240" y="130" width="320" height="200" rx="6" fill="none" stroke="#4DA8FF" stroke-width="1.5" opacity="0.35" stroke-dasharray="8,4"/>
  <!-- Lock icon at top of enclosure -->
  <g transform="translate(400, 130)">
    <rect x="-10" y="-4" width="20" height="16" rx="3" fill="none" stroke="#4DA8FF" stroke-width="1.5" opacity="0.7"/>
    <path d="M-5,-4 L-5,-10 Q-5,-18 0,-18 Q5,-18 5,-10 L5,-4" fill="none" stroke="#4DA8FF" stroke-width="1.5" opacity="0.7"/>
    <circle cx="0" cy="5" r="2" fill="#4DA8FF" opacity="0.7"/>
  </g>
  <!-- Pipeline inside the enclosure -->
  <!-- Node 1: Document -->
  <rect x="275" y="185" width="40" height="50" rx="2" fill="none" stroke="#4DA8FF" stroke-width="1" opacity="0.5"/>
  <line x1="283" y1="198" x2="307" y2="198" stroke="#4DA8FF" stroke-width="0.7" opacity="0.4"/>
  <line x1="283" y1="206" x2="303" y2="206" stroke="#4DA8FF" stroke-width="0.7" opacity="0.4"/>
  <line x1="283" y1="214" x2="305" y2="214" stroke="#4DA8FF" stroke-width="0.7" opacity="0.4"/>
  <!-- Arrow 1 -->
  <line x1="320" y1="210" x2="355" y2="210" stroke="#4DA8FF" stroke-width="0.8" opacity="0.35"/>
  <polyline points="350,206 356,210 350,214" fill="none" stroke="#4DA8FF" stroke-width="0.8" opacity="0.35"/>
  <!-- Node 2: Processing (chunking) -->
  <rect x="360" y="192" width="36" height="36" rx="2" fill="none" stroke="#4DA8FF" stroke-width="1" opacity="0.5"/>
  <line x1="368" y1="205" x2="388" y2="205" stroke="#4DA8FF" stroke-width="0.7" opacity="0.4"/>
  <line x1="368" y1="215" x2="385" y2="215" stroke="#4DA8FF" stroke-width="0.7" opacity="0.4"/>
  <!-- Arrow 2 -->
  <line x1="400" y1="210" x2="435" y2="210" stroke="#4DA8FF" stroke-width="0.8" opacity="0.35"/>
  <polyline points="430,206 436,210 430,214" fill="none" stroke="#4DA8FF" stroke-width="0.8" opacity="0.35"/>
  <!-- Node 3: Vector store -->
  <circle cx="465" cy="210" r="20" fill="none" stroke="#4DA8FF" stroke-width="1" opacity="0.5"/>
  <g fill="#4DA8FF" opacity="0.4">
    <circle cx="458" cy="204" r="1.5"/>
    <circle cx="472" cy="204" r="1.5"/>
    <circle cx="465" cy="216" r="1.5"/>
    <circle cx="456" cy="212" r="1.5"/>
    <circle cx="474" cy="212" r="1.5"/>
  </g>
  <!-- Arrow 3: output -->
  <line x1="488" y1="210" x2="520" y2="210" stroke="#4DA8FF" stroke-width="0.8" opacity="0.35"/>
  <polyline points="515,206 521,210 515,214" fill="none" stroke="#4DA8FF" stroke-width="0.8" opacity="0.35"/>
  <!-- Output node -->
  <rect x="525" y="198" width="24" height="24" rx="4" fill="none" stroke="#4DA8FF" stroke-width="1.2" opacity="0.6"/>
  <circle cx="537" cy="210" r="4" fill="#4DA8FF" opacity="0.4"/>
  <!-- Barrier marks on the enclosure edges -->
  <g stroke="#4DA8FF" stroke-width="1" opacity="0.2">
    <line x1="240" y1="160" x2="248" y2="160"/>
    <line x1="240" y1="180" x2="248" y2="180"/>
    <line x1="240" y1="200" x2="248" y2="200"/>
    <line x1="240" y1="220" x2="248" y2="220"/>
    <line x1="240" y1="240" x2="248" y2="240"/>
    <line x1="240" y1="260" x2="248" y2="260"/>
    <line x1="240" y1="280" x2="248" y2="280"/>
    <line x1="240" y1="300" x2="248" y2="300"/>
    <line x1="552" y1="160" x2="560" y2="160"/>
    <line x1="552" y1="180" x2="560" y2="180"/>
    <line x1="552" y1="200" x2="560" y2="200"/>
    <line x1="552" y1="220" x2="560" y2="220"/>
    <line x1="552" y1="240" x2="560" y2="240"/>
    <line x1="552" y1="260" x2="560" y2="260"/>
    <line x1="552" y1="280" x2="560" y2="280"/>
    <line x1="552" y1="300" x2="560" y2="300"/>
  </g>
</svg>