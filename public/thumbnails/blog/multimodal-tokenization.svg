<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <rect width="800" height="450" fill="#0D0F12"/>
  <!-- Subtle background grid -->
  <g stroke="#1A1D22" stroke-width="0.5">
    <line x1="0" y1="75" x2="800" y2="75"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="133" y1="0" x2="133" y2="450"/>
    <line x1="266" y1="0" x2="266" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="533" y1="0" x2="533" y2="450"/>
    <line x1="666" y1="0" x2="666" y2="450"/>
  </g>
  <!-- Data stream 1 (top) — image-like: small squares -->
  <g fill="none" stroke="#00E5A0" stroke-width="0.8" opacity="0.4">
    <rect x="180" y="135" width="12" height="12"/>
    <rect x="198" y="135" width="12" height="12"/>
    <rect x="216" y="135" width="12" height="12"/>
    <rect x="180" y="153" width="12" height="12"/>
    <rect x="198" y="153" width="12" height="12"/>
    <rect x="216" y="153" width="12" height="12"/>
  </g>
  <!-- Data stream 2 (middle) — text-like: horizontal lines -->
  <g stroke="#00E5A0" stroke-width="1" opacity="0.4">
    <line x1="180" y1="215" x2="240" y2="215"/>
    <line x1="180" y1="225" x2="230" y2="225"/>
    <line x1="180" y1="235" x2="245" y2="235"/>
  </g>
  <!-- Data stream 3 (bottom) — audio-like: waveform -->
  <g stroke="#00E5A0" stroke-width="1" opacity="0.4" fill="none">
    <polyline points="180,300 190,290 200,310 210,285 220,315 230,295 240,305"/>
  </g>
  <!-- Flow lines from streams to merge point -->
  <g stroke="#00E5A0" stroke-width="0.8" opacity="0.25">
    <line x1="235" y1="150" x2="370" y2="215"/>
    <line x1="245" y1="225" x2="370" y2="225"/>
    <line x1="240" y1="300" x2="370" y2="235"/>
  </g>
  <!-- Merge/convergence point -->
  <circle cx="385" cy="225" r="16" fill="none" stroke="#00E5A0" stroke-width="1.5" opacity="0.5"/>
  <circle cx="385" cy="225" r="4" fill="#00E5A0" opacity="0.6"/>
  <!-- Arrow out from merge -->
  <line x1="401" y1="225" x2="460" y2="225" stroke="#00E5A0" stroke-width="1" opacity="0.4"/>
  <polyline points="454,220 460,225 454,230" fill="none" stroke="#00E5A0" stroke-width="1" opacity="0.4"/>
  <!-- Output tokens — uniform small rounded rects -->
  <g fill="none" stroke="#00E5A0" stroke-width="1.2" opacity="0.6">
    <rect x="475" y="195" width="28" height="16" rx="3"/>
    <rect x="510" y="195" width="28" height="16" rx="3"/>
    <rect x="545" y="195" width="28" height="16" rx="3"/>
    <rect x="580" y="195" width="28" height="16" rx="3"/>
    <rect x="475" y="220" width="28" height="16" rx="3"/>
    <rect x="510" y="220" width="28" height="16" rx="3"/>
    <rect x="545" y="220" width="28" height="16" rx="3"/>
    <rect x="580" y="220" width="28" height="16" rx="3"/>
    <rect x="475" y="245" width="28" height="16" rx="3"/>
    <rect x="510" y="245" width="28" height="16" rx="3"/>
    <rect x="545" y="245" width="28" height="16" rx="3"/>
    <rect x="580" y="245" width="28" height="16" rx="3"/>
  </g>
  <!-- Highlight a couple tokens -->
  <rect x="510" y="220" width="28" height="16" rx="3" fill="#00E5A0" opacity="0.15"/>
  <rect x="475" y="245" width="28" height="16" rx="3" fill="#00E5A0" opacity="0.15"/>
</svg>