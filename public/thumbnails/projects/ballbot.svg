<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <rect width="800" height="450" fill="#0D0F12"/>
  <!-- Subtle background grid -->
  <g stroke="#1A1D22" stroke-width="0.5">
    <line x1="0" y1="75" x2="800" y2="75"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="133" y1="0" x2="133" y2="450"/>
    <line x1="266" y1="0" x2="266" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="533" y1="0" x2="533" y2="450"/>
    <line x1="666" y1="0" x2="666" y2="450"/>
  </g>
  <!-- Ball (circle) -->
  <circle cx="400" cy="225" r="48" fill="none" stroke="#00E5A0" stroke-width="2"/>
  <circle cx="400" cy="225" r="4" fill="#00E5A0"/>
  <!-- Balance lines radiating outward -->
  <g stroke="#00E5A0" stroke-width="1.2" opacity="0.7">
    <line x1="400" y1="170" x2="400" y2="100"/>
    <line x1="448" y1="197" x2="500" y2="145"/>
    <line x1="455" y1="240" x2="520" y2="260"/>
    <line x1="400" y1="280" x2="400" y2="340"/>
    <line x1="345" y1="240" x2="280" y2="260"/>
    <line x1="352" y1="197" x2="300" y2="145"/>
  </g>
  <!-- Small dots at line ends -->
  <g fill="#00E5A0" opacity="0.5">
    <circle cx="400" cy="100" r="3"/>
    <circle cx="500" cy="145" r="3"/>
    <circle cx="520" cy="260" r="3"/>
    <circle cx="400" cy="340" r="3"/>
    <circle cx="280" cy="260" r="3"/>
    <circle cx="300" cy="145" r="3"/>
  </g>
  <!-- Thin arc suggesting gyroscopic motion -->
  <ellipse cx="400" cy="225" rx="80" ry="20" fill="none" stroke="#00E5A0" stroke-width="0.8" opacity="0.3" transform="rotate(-15 400 225)"/>
  <ellipse cx="400" cy="225" rx="80" ry="20" fill="none" stroke="#00E5A0" stroke-width="0.8" opacity="0.3" transform="rotate(15 400 225)"/>
</svg>